#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Forward-compat canary: intentionally builds against duckdb `main` (the v2.0
  # line, v2.0-cyanoptera). It matters because duckdb/community-extensions builds
  # EVERY release PR against v2.0 via build_next.yml, with no per-extension
  # opt-out -- so a red v2.0 build is a red check on every release here.
  #
  # This job was previously commented out because the Identifier migration on
  # duckdb main was a moving target and `continue-on-error` is not permitted on a
  # job that calls a reusable workflow (adding it makes the whole workflow fail to
  # parse, scheduling zero jobs). The fix for that is the `if:` below rather than
  # deletion: the canary runs only on manual dispatch and on pushes to main, so it
  # never appears in a PR's check rollup and cannot block a merge. Merge-readiness
  # is still judged on the stable build below.
  duckdb-next-build:
    name: Canary — build against DuckDB main (advisory)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: scalarfs

  duckdb-stable-build:
    name: Build extension binaries
    # Submodules track the v1.5-variegata stable release branch (see .gitmodules);
    # the bump pulls the vendored-fmt MSVC fix (duckdb 89f4cd3d3b, "Remove
    # checked_array_iterator from fmt dep (1.5)"), which is what previously broke
    # Windows -- so Windows is re-enabled below. No Identifier migration landed on
    # this release branch, so the surfaces this extension uses stay API-stable.
    #
    # BUILD TARGET is the v1.5.4 *release tag*, not the branch tip: branch-tip
    # builds emit non-loadable -dev extensions, so the shippable/loadable
    # artifacts and integration tests must pin the release. ci_tools_version and
    # the reusable-workflow ref stay on v1.5-variegata (branch) -- matches the
    # duckdb_zim reference config.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: scalarfs

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: scalarfs
      format_checks: 'format;tidy'
