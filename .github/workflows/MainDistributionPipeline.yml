#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # duckdb-next (HEAD) build is paused. duckdb main is mid-migration to a typed
  # Identifier (user_variables keys, child_list_t keys, copy_to_bind_t signature,
  # and counting) -- a moving target. The source-side fixes here are guarded by
  # __has_include so they stay forward-compatible; re-enable and re-sync against
  # the next duckdb *release* once that migration settles. (continue-on-error is
  # not permitted on reusable-workflow jobs, so we pause the job to unblock CI.)
  #
  # duckdb-next-build:
  #   name: Build extension binaries
  #   uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
  #   with:
  #     duckdb_version: main
  #     ci_tools_version: main
  #     extension_name: scalarfs

  duckdb-stable-build:
    name: Build extension binaries
    # Bumped v1.4.4 → v1.5.3 (current duckdb stable). v1.4.x and v1.5.x are
    # API-identical for the surfaces this extension uses (verified via grep:
    # no ExecuteWithNulls / SetCardinality / aliased-SetValue / FlatVector
    # GetData<T> writes), so no source changes are needed alongside the bump.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.3
    with:
      duckdb_version: v1.5.3
      ci_tools_version: v1.5.3
      extension_name: scalarfs
      # Windows excluded: duckdb's vendored fmt fails on the runner's MSVC
      # (stdext checked_array_iterator removed) -- upstream, not scalarfs. No
      # Windows artifact has been published for this extension.
      exclude_archs: 'windows_amd64;windows_amd64_mingw'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.3
    with:
      duckdb_version: v1.5.3
      ci_tools_version: v1.5.3
      extension_name: scalarfs
      format_checks: 'format;tidy'
