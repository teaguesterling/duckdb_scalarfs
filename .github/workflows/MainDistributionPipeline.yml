#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # github.event_name is part of the key ON PURPOSE. Without it a push to a branch
  # and a workflow_dispatch on that same branch collide: same ref, same sha, both
  # with empty head_ref/base_ref. cancel-in-progress then kills the push run every
  # time the canary below is dispatched by hand -- and a CANCELLED run renders as a
  # red `fail` on the checks dashboard, indistinguishable from real breakage. That
  # has manufactured phantom failures across this fleet; do not remove this segment.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # THE NEXT-LINE BUILD: the v2.0 RELEASE branch, not `main`. One canary line for
  # the whole fleet, and the branch v2.0.0 is cut from. Pinning the release branch
  # is what makes a red run actionable -- `main` moves underneath the job, so a
  # failure there cannot be told apart from upstream churn.
  #
  # It runs on pull requests as well as pushes to main, because what it checks is a
  # property of the CHANGE, not of upstream drift. duckdb/community-extensions
  # builds every release against the v2.0 line with no per-extension opt-out, so a
  # break here is a red check on every release -- which is why this is a gate and
  # not advisory.
  #
  # `if` rather than `continue-on-error`: a job calling a REUSABLE WORKFLOW accepts
  # only name/needs/if/permissions/uses/with/secrets/strategy/concurrency, and
  # adding continue-on-error makes the whole workflow fail to PARSE (zero jobs
  # scheduled, run marked failed).
  duckdb-next-build:
    name: Next-line build — DuckDB v2.0
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: scalarfs

  # Advisory canary against duckdb `main`, which is AHEAD of the v2.0 release
  # branch. Kept as its own job rather than merged into the one above: this one may
  # legitimately be red on churn that will never reach v2.0.0, so it stays gated to
  # dispatch and pushes to main and never enters a PR's check rollup.
  duckdb-main-canary:
    name: Canary build — DuckDB main (advisory)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: scalarfs

  duckdb-stable-build:
    name: Build extension binaries
    # Submodules track the v1.5-variegata stable release branch (see .gitmodules);
    # the bump pulls the vendored-fmt MSVC fix (duckdb 89f4cd3d3b, "Remove
    # checked_array_iterator from fmt dep (1.5)"), which is what previously broke
    # Windows -- so Windows is re-enabled below. No Identifier migration landed on
    # this release branch, so the surfaces this extension uses stay API-stable.
    #
    # BUILD TARGET is the v1.5.4 *release tag*, not the branch tip: branch-tip
    # builds emit non-loadable -dev extensions, so the shippable/loadable
    # artifacts and integration tests must pin the release. ci_tools_version and
    # the reusable-workflow ref stay on v1.5-variegata (branch) -- matches the
    # duckdb_zim reference config.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: scalarfs

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: scalarfs
      format_checks: 'format;tidy'
