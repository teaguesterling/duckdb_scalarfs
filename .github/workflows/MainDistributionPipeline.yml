#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  # Pushes build only on main. A push to a PR branch fires a push run AND a
  # pull_request run for the same commit, so every ungated job here built
  # TWICE per push: 12 duplicate jobs, 2 of them hosted macOS legs and 2
  # hosted Windows, measured on 8506aff1f5 (push run 39142741166 and
  # pull_request run 39142743030, same head_sha). The pull_request run is
  # the one whose status matters. What the filter costs: a branch with no PR
  # open gets no CI until the PR opens. Nothing here deploys on tags, and
  # workflow_dispatch still runs on any branch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # github.event_name is part of the key ON PURPOSE. Without it a push to a branch
  # and a workflow_dispatch on that same branch collide: same ref, same sha, both
  # with empty head_ref/base_ref. cancel-in-progress then kills the push run every
  # time the canary below is dispatched by hand -- and a CANCELLED run renders as a
  # red `fail` on the checks dashboard, indistinguishable from real breakage. That
  # has manufactured phantom failures across this fleet; do not remove this segment.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # THE NEXT-LINE BUILD: the v2.0 RELEASE branch, not `main`. One canary line for
  # the whole fleet, and the branch v2.0.0 is cut from. Pinning the release branch
  # is what makes a red run actionable -- `main` moves underneath the job, so a
  # failure there cannot be told apart from upstream churn.
  #
  # It runs on pull requests as well as pushes to main, because what it checks is a
  # property of the CHANGE, not of upstream drift. duckdb/community-extensions
  # builds every release against the v2.0 line with no per-extension opt-out, so a
  # break here is a red check on every release -- which is why this is a gate and
  # not advisory.
  #
  # `if` rather than `continue-on-error`: a job calling a REUSABLE WORKFLOW accepts
  # only name/needs/if/permissions/uses/with/secrets/strategy/concurrency, and
  # adding continue-on-error makes the whole workflow fail to PARSE (zero jobs
  # scheduled, run marked failed).
  #
  # The branch is resolved to a (commit, version) PAIR in the job below, not passed
  # as `duckdb_version: v2.0-cyanoptera`. extension-ci-tools@main links a prebuilt
  # libduckdb from duckdb-staging whenever one exists for the commit, and that
  # library reports its staged version (v2.0.1-alpha50125 at bb5bdadda4). A branch
  # name or SHA in duckdb_version gets stamped into the extension instead, the
  # loader refuses it ("built specifically for DuckDB version 'v2.0-cyanoptera'"),
  # and `require scalarfs` fails every test (pull_request run 40213743108).
  # ci_phase.py only uses DUCKDB_VERSION verbatim when it is version-shaped, so
  # the resolver refuses anything else rather than reintroduce the mismatch.
  #
  # Staging builds only some branch commits, and often not the tip (2026-10-26:
  # af2d380a19 404, two of the newest eight staged). So the resolver walks back up
  # to 150 commits to the newest staged one and uses that commit with its own
  # version, printing a ::notice:: with the lag. No staged commit in range is a
  # staging outage, and the job fails. Same text as plinking_duck #74 (fleet).
  duckdb-next-ref:
    name: Next-line build — resolve DuckDB v2.0
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          DEPTH=150
          tip=$(git ls-remote https://github.com/duckdb/duckdb.git refs/heads/v2.0-cyanoptera | cut -f1)
          [ -n "$tip" ] || { echo "::error::could not resolve duckdb v2.0-cyanoptera"; exit 1; }

          tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          git clone --quiet --filter=blob:none --no-checkout --depth "$DEPTH" \
              --branch v2.0-cyanoptera https://github.com/duckdb/duckdb.git "$tmp/duckdb"

          commit=""; version=""; behind=0
          for sha in $(git -C "$tmp/duckdb" log --format=%H -n "$DEPTH"); do
            v=$(curl -sSfL "https://duckdb-staging.duckdb.org/${sha:0:10}/latest_alpha_version.txt" 2>/dev/null | tr -d '[:space:]') || { behind=$((behind+1)); continue; }
            if [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc|dev)[0-9]+)?$ ]]; then
              commit="$sha"; version="$v"; break
            fi
            behind=$((behind+1))
          done

          if [ -z "$commit" ]; then
            echo "::error::no staged DuckDB build for v2.0-cyanoptera in its last $DEPTH commits (tip $tip)"
            exit 1
          fi

          echo "v2.0-cyanoptera tip is $tip"
          echo "resolved $commit, version $version ($behind commit(s) behind the tip)"
          if [ "$behind" -gt 0 ]; then
            echo "::notice::the v2.0-cyanoptera tip ($tip) has no staged build; using $commit ($version), $behind commit(s) back"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  duckdb-next-build:
    name: Next-line build — DuckDB v2.0
    needs: duckdb-next-ref
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: ${{ needs.duckdb-next-ref.outputs.version }}
      duckdb_commit: ${{ needs.duckdb-next-ref.outputs.commit }}
      ci_tools_version: main
      extension_name: scalarfs

      # Make a skipped test run FAIL on this leg. `T` is the test pattern ci-tools
      # hands run_tests.py (`T ?=` in duckdb_extension.Makefile, so an env var wins)
      # and test_env_variables reaches `make test_release` via ci_phase.py.
      # `--require scalarfs` turns "could not load" into `require scalarfs: FAILED`
      # instead of a silent skip. Verified on ci-tools main against b15358c371d:
      # present -> exit 0 "16 passed, 2 skipped"; hidden -> exit 2 "0 passed, 18 failed".
      # Needs a ci_tools_version that HAS `T` (main / v2.0-cyanoptera); on
      # v1.5-variegata the variable is silently ignored -- hence `make test-require`.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require scalarfs\" \"test/*\""}}'
  # Advisory canary against duckdb `main`, which is AHEAD of the v2.0 release
  # branch. Kept as its own job rather than merged into the one above: this one may
  # legitimately be red on churn that will never reach v2.0.0, so it stays gated to
  # dispatch and pushes to main and never enters a PR's check rollup.
  #
  # Same skip guard as the next-line build. Without it every leg here reported
  # "ran tests: 0 passed, 29 skipped" (`require scalarfs: 29`) and concluded green
  # (main run 40254809357).
  #
  # Those skips were the #28 defect again. `duckdb_version: main` reaches the build
  # as DUCKDB_VERSION=main, and duckdb main's CMakeLists.txt reads that env var as
  # its explicit version. The binary then reports 'vmain', the extension is stamped
  # 'main', and the loader refuses it ("built specifically for DuckDB version
  # 'main' ... this version of DuckDB is 'vmain'"; reproduced locally 2026-10-27).
  # So the job below resolves main to a (commit, version) pair, computing the
  # version the way duckdb's own CMake does for a dev build:
  # v<scripts/ci/release_version.txt>.0-dev<git rev-list --count HEAD>.
  # Staging builds no prebuilt for main, so ci-tools builds from source.
  duckdb-main-ref:
    name: Canary build — resolve DuckDB main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          # Commits only: rev-list --count needs the whole history, not its trees.
          git clone --quiet --filter=tree:0 --no-checkout --single-branch --branch main \
              https://github.com/duckdb/duckdb.git "$tmp/duckdb"
          commit=$(git -C "$tmp/duckdb" rev-parse HEAD)
          release=$(git -C "$tmp/duckdb" show HEAD:scripts/ci/release_version.txt | tr -d '[:space:]')
          count=$(git -C "$tmp/duckdb" rev-list --count HEAD)
          version="v${release}.0-dev${count}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.0-dev[0-9]+$ ]]; then
            echo "::error::could not build a dev version for duckdb main at $commit (got '$version')"
            exit 1
          fi
          echo "duckdb main -> $commit, version $version"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  duckdb-main-canary:
    name: Canary build — DuckDB main (advisory)
    needs: duckdb-main-ref
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: ${{ needs.duckdb-main-ref.outputs.version }}
      duckdb_commit: ${{ needs.duckdb-main-ref.outputs.commit }}
      ci_tools_version: main
      extension_name: scalarfs
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require scalarfs\" \"test/*\""}}'

  duckdb-stable-build:
    name: Build extension binaries
    # Submodules track the v1.5-variegata stable release branch (see .gitmodules);
    # the bump pulls the vendored-fmt MSVC fix (duckdb 89f4cd3d3b, "Remove
    # checked_array_iterator from fmt dep (1.5)"), which is what previously broke
    # Windows -- so Windows is re-enabled below. No Identifier migration landed on
    # this release branch, so the surfaces this extension uses stay API-stable.
    #
    # BUILD TARGET is the v1.5.4 *release tag*, not the branch tip: branch-tip
    # builds emit non-loadable -dev extensions, so the shippable/loadable
    # artifacts and integration tests must pin the release. ci_tools_version and
    # the reusable-workflow ref stay on v1.5-variegata (branch) -- matches the
    # duckdb_zim reference config.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: scalarfs

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: scalarfs
      format_checks: 'format;tidy'
